<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hồi Máu · Chuyển động</title>
<style>
:root{color-scheme:light;--primary:#2458D3;--soft:#EAF0FF;--lime:#D8F58A;--bg:#F7F9FC;--ink:#182743;--muted:#56647B;--line:#DCE3EE;--white:#FFFFFF;--error:#B63838;--flame:#C2410C;--flame-soft:#FFF1E6;--frost:#0E7490;--frost-soft:#E3F6F9;--gold:#B45309;--gold-soft:#FFF4DB;--leaf:#88D64B;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}
body{max-width:1200px;margin:0 auto;padding:24px 16px;background:var(--bg)}
h1{font:700 24px/1.3 'Be Vietnam Pro',Inter,system-ui,sans-serif;margin:0}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
header p{margin:4px 0 0;color:var(--muted);max-width:62ch;line-height:1.5}
header label{display:flex;gap:8px;align-items:center;min-height:48px;font-weight:600}
select{min-height:40px;border-radius:10px;border:1px solid var(--line);padding:0 8px;font:inherit}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:20px}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font:600 15px/1.3 ui-monospace,Consolas,monospace;margin:0}
.meta{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.stage{height:190px;border-radius:14px;background:var(--soft);display:grid;place-items:center;overflow:hidden;position:relative}
.play{min-height:48px;border:0;border-radius:14px;background:var(--primary);color:var(--white);font:600 15px/1 Inter,system-ui,sans-serif;cursor:pointer}
.play:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.rm{display:none;font-size:13px;line-height:1.5;background:var(--soft);border-radius:10px;padding:8px 10px;margin:0}
.reduced .rm{display:block}
/* demo library: each template's resting state is the designed static (reduced-motion) state */
.d-col{display:flex;flex-direction:column;align-items:center;gap:10px}
.d-cap{font-size:13px;color:var(--muted);margin:0}
.d-err{color:var(--error)}
.d-btn{display:inline-block;min-height:48px;padding:0 24px;border-radius:14px;background:var(--primary);color:var(--white);font:600 15px/48px Inter,system-ui,sans-serif}
.d-mam{position:relative;width:128px;height:150px}
.d-mam svg{position:relative;width:128px;height:128px;overflow:visible;transform-origin:50% 100%}
.d-mam [id^="face-"]{display:none}
.d-mam[data-mood="neutral"] #face-neutral,.d-mam[data-mood="happy"] #face-happy,.d-mam[data-mood="tired"] #face-tired{display:inline}
.d-mam svg g{transform-box:view-box} /* pivots come from each group's inline transform-origin (viewBox px) */
.d-mam .eye{transform-box:fill-box;transform-origin:50% 50%}
.d-mam[data-mood="tired"] #leaf-left{transform:rotate(-12deg)}
.d-mam[data-mood="tired"] #leaf-right{transform:rotate(12deg)}
.d-shadow{position:absolute;bottom:4px;left:24px;width:80px;height:10px;border-radius:50%;background:var(--line)}
.d-z{position:absolute;top:6px;right:4px;font:700 18px/1 Inter,system-ui,sans-serif;color:var(--primary);opacity:0}
.d-mam[data-mood="tired"] .d-z{opacity:1}
.d-check{width:64px;height:64px}
.d-check .ring{fill:none;stroke:var(--primary);stroke-width:3}
.d-check .fill{fill:var(--primary);transform-box:fill-box;transform-origin:50% 50%}
.d-check .tick{fill:none;stroke:var(--white);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1}
.d-switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--primary)}
.d-switch .thumb{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--white);transform:translateX(20px)}
.d-tabs{position:relative;display:grid;grid-template-columns:repeat(4,60px);height:56px;background:var(--white);border-radius:14px;font-size:11px;color:var(--muted)}
.d-tabs span{position:relative;z-index:1;display:grid;place-items:end center;padding-bottom:8px}
.d-tabs .pill{position:absolute;top:6px;left:6px;width:48px;height:44px;border-radius:12px;background:var(--soft);transform:translateX(60px)}
.d-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 8px}
.d-chips span{min-height:40px;padding:0 12px;border-radius:12px;background:var(--soft);color:var(--primary);font:600 13px/40px Inter,system-ui,sans-serif;box-shadow:inset 0 0 0 1px var(--primary)}
.d-chips .on{background:var(--primary);color:var(--white)}
.d-rows{list-style:none;margin:0;padding:0 12px;width:100%;display:grid;gap:6px}
.d-rows li{background:var(--white);border-radius:12px;padding:6px 12px;font-size:13px}
.d-num{font:700 40px/1 'Be Vietnam Pro',Inter,system-ui,sans-serif;color:var(--ink)}
.d-bar{width:200px;height:10px;border-radius:5px;background:var(--white);overflow:hidden}
.d-bar .fill{display:block;height:100%;background:var(--primary);transform-origin:0 50%}
.d-skel{display:grid;gap:10px;width:220px}
.d-skel i{display:block;height:36px;border-radius:12px;background:linear-gradient(90deg,var(--line) 0%,#F1F4F9 50%,var(--line) 100%) 0 0/240px 100% repeat-x}
.d-snack{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;width:236px;min-height:56px;padding:8px 12px;border-radius:14px;background:var(--ink);color:var(--white);font-size:13px;overflow:hidden}
.d-snack b{color:var(--lime)}
.d-snack .countdown{position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--lime);transform-origin:0 50%;transform:scaleX(0.6)}
.d-field{display:grid;gap:6px;width:220px;font-size:13px}
.d-field .input{display:flex;align-items:center;height:48px;padding:0 14px;border:2px solid var(--error);border-radius:14px;background:var(--white);font-size:15px}
.d-field .msg{margin:0;color:var(--error)}
.d-pending{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--white);font-size:13px}
.d-pending .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.d-water{display:grid;grid-template-columns:repeat(4,40px);gap:8px}
.d-water i{position:relative;display:block;height:40px;border-radius:10px;background:var(--white);overflow:hidden}
.d-water .on,.d-water .level{background:var(--primary)}
.d-water .level{position:absolute;inset:0;display:block;transform-origin:50% 100%}
.d-water .drop{position:absolute;left:14px;top:6px;display:block;width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#6F9BF0;opacity:0}
.d-water .undo .level{transform:scaleY(0)}
.d-chip{display:inline-block;padding:4px 10px;border-radius:10px;background:var(--white);color:var(--primary);font:600 13px/1.4 Inter,system-ui,sans-serif}
.d-quest{display:flex;align-items:center;gap:10px;width:240px;padding:10px 12px;border-radius:14px;background:var(--white);font-size:14px}
.d-quest .d-check{flex:none;width:32px;height:32px}
.d-quest span{flex:1}
.d-quest .d-chip{background:var(--soft)}
.d-coins{position:relative;width:220px;height:120px}
.d-coins .coin{position:absolute;left:30px;bottom:20px;width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px #F2C46B;opacity:0}
.d-coinchip{position:absolute;right:10px;top:16px;padding:6px 12px;border-radius:12px;background:var(--gold-soft);color:var(--gold);font:600 14px/1.4 Inter,system-ui,sans-serif}
.d-hidden{display:grid;width:230px;perspective:600px}
.d-hidden div{grid-area:1/1;padding:16px;border-radius:14px;background:var(--white);font:600 14px/1.4 Inter,system-ui,sans-serif;backface-visibility:hidden}
.d-hidden .front{opacity:0}
.d-sky{position:absolute;inset:0}
.d-sky i{position:absolute;display:block}
.d-sky .night{inset:0;background:linear-gradient(var(--ink),var(--primary))}
.d-sky .dusk{inset:0;background:linear-gradient(var(--soft),var(--gold-soft));opacity:0}
.d-sky .moon{right:48px;top:36px;width:40px;height:40px;border-radius:50%;box-shadow:-10px 6px 0 0 var(--lime)}
.d-sky .star{width:4px;height:4px;border-radius:50%;background:var(--white)}
.d-sky .star:nth-of-type(4){left:40px;top:40px}.d-sky .star:nth-of-type(5){left:90px;top:74px}.d-sky .star:nth-of-type(6){left:150px;top:30px}
.d-steps{display:grid;gap:14px;width:230px}
.d-steps .bar{height:6px;border-radius:3px;background:var(--white);overflow:hidden}
.d-steps .fill{display:block;height:100%;background:var(--primary);transform-origin:0 50%;transform:scaleX(0.67)}
.d-steps .content{padding:16px;border-radius:14px;background:var(--white);font:700 17px/1.3 'Be Vietnam Pro',Inter,system-ui,sans-serif}
.d-arch{display:flex;align-items:center;justify-content:space-between;width:230px;padding:16px;border:2px solid var(--primary);border-radius:20px;background:var(--white);font:600 15px/1.4 Inter,system-ui,sans-serif}
.d-arch .tick{display:block;width:20px;height:20px;border-radius:50%;background:var(--primary)}
.d-ring{width:140px;height:140px}
.d-ring .track{fill:none;stroke:var(--white);stroke-width:10}
.d-ring .prog{fill:none;stroke:var(--primary);stroke-width:10;stroke-linecap:round;stroke-dasharray:1;transform-box:fill-box;transform-origin:50% 50%;transform:rotate(-90deg)}
.d-ring text{font:700 22px Inter,system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.d-swap{display:grid;width:230px}
.d-swap > div{grid-area:1/1;padding:14px;border-radius:14px;background:var(--white);font-size:14px}
.d-swap .old{opacity:0}
.d-pose{width:130px;height:130px}
.d-pose circle{fill:var(--primary)}
.d-pose path{fill:none;stroke:var(--primary);stroke-width:6;stroke-linecap:round}
.d-pose .b{opacity:0}
.d-breathe{position:relative;display:grid;place-items:center;width:150px;height:150px}
.d-breathe .circle{position:absolute;inset:0;border-radius:50%;background:var(--white);box-shadow:inset 0 0 0 4px var(--primary);transform:scale(0.7)}
.d-breathe span{position:relative;grid-area:1/1;font:600 15px Inter,system-ui,sans-serif}
.d-breathe .out{opacity:0}
.d-timer{display:grid;place-items:center;gap:6px}
.d-timer b{font:700 44px/1 Inter,system-ui,sans-serif;opacity:0.5}
.d-timer span{grid-area:2/1;font-size:14px;color:var(--muted)}
.d-timer .run{opacity:0}
.d-level{position:relative;display:grid;place-items:center;gap:8px}
.d-level .rays{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:repeating-conic-gradient(var(--lime) 0 10deg,transparent 10deg 30deg);opacity:0}
.d-level .badge{position:relative;display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:var(--primary);color:var(--white);font:700 36px/1 'Be Vietnam Pro',Inter,system-ui,sans-serif;box-shadow:0 0 0 6px var(--lime)}
.d-level b{position:relative;font-size:15px}
.d-flame{width:56px;height:56px}
.d-flame path{fill:var(--flame);transform-box:fill-box;transform-origin:50% 100%}
.d-milestone{position:relative;display:grid;place-items:center;width:200px;height:170px}
.d-milestone .d-flame{position:absolute;opacity:0}
.d-milestone .badge{display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:var(--flame-soft);color:var(--flame);font:700 34px/1 'Be Vietnam Pro',Inter,system-ui,sans-serif;box-shadow:0 0 0 4px var(--flame)}
.d-milestone .ribbon{position:absolute;bottom:4px;padding:4px 12px;border-radius:10px;background:var(--flame);color:var(--white);font:600 13px/1.4 Inter,system-ui,sans-serif}
.d-reset{display:grid;gap:10px;width:230px}
.d-reset .best{padding:16px;border-radius:14px;background:var(--white);font:700 17px 'Be Vietnam Pro',Inter,system-ui,sans-serif}
.d-reset .cta{padding:14px;border-radius:14px;background:var(--primary);color:var(--white);text-align:center;font:600 15px Inter,system-ui,sans-serif}
.d-evolve{position:relative;display:grid;place-items:center;width:180px;height:180px}
.d-evolve > *{grid-area:1/1}
.d-evolve .glow{width:160px;height:160px;border-radius:50%;background:radial-gradient(var(--lime),transparent 70%);opacity:0}
.d-evolve .from{opacity:0}
.d-path{position:relative;display:flex;justify-content:space-between;align-items:center;width:230px;height:40px}
.d-path .line{position:absolute;left:12px;right:12px;top:18px;display:block;height:4px;background:var(--white)}
.d-path .fill{display:block;height:100%;background:var(--primary);transform-origin:0 50%;transform:scaleX(0.25)}
.d-path .node{position:relative;display:block;width:24px;height:24px;border-radius:50%;background:var(--white);border:3px solid var(--line)}
.d-path .done,.d-path .cur{border-color:var(--primary);background:var(--primary)}
.d-path .cur{box-shadow:0 0 0 5px var(--lime)}
.d-unlock{position:relative;display:grid;justify-items:center;gap:10px;width:200px}
.d-unlock .item{position:relative;width:150px;height:100px;border-radius:14px;background:linear-gradient(135deg,#E4F2E6,#166534);overflow:hidden}
.d-unlock .sheen{position:absolute;top:0;bottom:0;display:block;width:40px;background:rgba(255,255,255,0.6);transform:translateX(-120%) skewX(-20deg)}
.d-unlock .stamp{position:absolute;top:8px;right:0;padding:4px 10px;border-radius:10px;background:var(--soft);color:var(--primary);font:600 13px/1.4 Inter,system-ui,sans-serif;transform:rotate(-8deg)}
.d-unlock .d-coinchip{position:static}
.d-theme{position:relative;display:grid;place-items:center;width:200px;height:120px;border-radius:14px;overflow:hidden;color:var(--white);font:600 15px/1 Inter,system-ui,sans-serif}
.d-theme i{position:absolute;inset:0}
.d-theme .old{background:linear-gradient(135deg,#EAF0FF,#2458D3)}
.d-theme .new{background:linear-gradient(135deg,#E4F2E6,#166534)}
.d-theme span{position:relative}
.d-plane{position:relative;display:grid;place-items:center;gap:10px}
.d-plane .sent{color:var(--primary);font:600 14px Inter,system-ui,sans-serif}
.d-plane .plane{position:absolute;right:-20px;top:-6px;width:24px;height:24px;fill:var(--primary);opacity:0}
.d-rank{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--white);font-size:14px}
.d-rank .d-num{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--lime);font-size:24px}
.d-bell{position:relative;display:grid;place-items:center;width:48px;height:48px}
.d-bell svg{width:28px;height:28px;fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round}
.d-bell .dot{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px var(--soft)}
.d-page{position:relative;display:grid;place-items:center;width:200px;height:150px}
.d-page .sheet{display:block;width:110px;height:130px;border-radius:12px;background:var(--white)}
.d-page .leaf{position:absolute;left:90px;top:60px;display:block;width:14px;height:20px;border-radius:0 14px;background:var(--leaf);opacity:0}
.d-page .saved{position:absolute;bottom:0;color:var(--primary);font:600 14px Inter,system-ui,sans-serif}
.d-quote{display:grid;gap:2px;margin:0;font:700 20px/1.3 'Be Vietnam Pro',Inter,system-ui,sans-serif;text-align:center}
.d-ticket{display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px dashed var(--primary);border-radius:14px;background:var(--white);font:600 14px/1.4 Inter,system-ui,sans-serif}
.d-ticket b{padding:2px 8px;border-radius:8px;background:var(--lime);color:var(--ink)}
.d-week{display:flex;gap:10px}
.d-week i{position:relative;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--white)}
.d-week .done{border-color:var(--primary);background:var(--primary)}
.d-week .frost{border-color:var(--frost);background:var(--frost-soft)}
.d-week .ice{width:16px;height:16px;fill:none;stroke:var(--frost);stroke-width:2.5;stroke-linecap:round}
.d-particle{position:absolute;left:50%;top:50%;width:8px;height:12px;border-radius:8px 0;pointer-events:none}
.d-rig{width:200px;height:160px}
.d-rig svg{width:200px;height:160px;overflow:visible}
.d-rig svg g{transform-box:view-box}
.d-rig [id^="prop-"]{display:none}
.d-rig[data-prop="mat"] #prop-mat,.d-rig[data-prop="bench"] #prop-bench{display:inline}
</style>
<header>
  <div>
    <h1>Hồi Máu · Chuyển động</h1>
    <p>Bấm “Phát” để xem từng chuyển động; không có gì tự chạy. Bật “Giảm chuyển động” để xem trạng thái thay thế. Dữ liệu lấy từ <code>tokens.json</code> và <code>catalog.json</code>.</p>
  </div>
  <label><input type="checkbox" id="rm-toggle"> Giảm chuyển động</label>
  <label>Hiển thị <select id="tier"><option value="">Tất cả</option><option value="1">Cốt lõi</option><option value="2">Thêm điểm nhấn</option></select></label>
</header>

<script>
const { tokens, catalog, mam, rig } = JSON.parse(document.getElementById('motion-data').textContent);
const grid = document.getElementById('grid');
const rmToggle = document.getElementById('rm-toggle');
const rmQuery = matchMedia('(prefers-reduced-motion: reduce)');
rmToggle.checked = rmQuery.matches;
const syncRm = () => {
  document.body.classList.toggle('reduced', rmToggle.checked);
  // Turning reduced motion on also stops whatever is already playing, loops included.
  if (rmToggle.checked) grid.querySelectorAll(':scope > .card').forEach(c => c.reset?.());
};
rmToggle.addEventListener('change', syncRm);
rmQuery.addEventListener('change', e => { rmToggle.checked = e.matches; syncRm(); });
syncRm();

const easing = name => {
  const e = tokens.easing[name] ?? tokens.springs[name]?.webApprox;
  return e ? `cubic-bezier(${e.join(',')})` : 'linear';
};
const ms = (t, a) => tokens.durationsMs[t.durationToken ?? a.durationToken];
const svgOf = stage => mam[`stage-${stage ?? 'hatchling'}`] ?? mam['stage-hatchling'];
const check = '<svg class="d-check" viewBox="0 0 48 48"><circle class="ring" cx="24" cy="24" r="20"/><circle class="fill" cx="24" cy="24" r="20"/><path class="tick" d="M15 25l6 6 12-13" pathLength="1"/></svg>';
const flame = '<svg class="d-flame" viewBox="0 0 48 48"><path d="M24 4c3 8 12 12 12 23a12 12 0 0 1-24 0c0-6 3-9 6-12 0 5 2 7 4 8-1-8 2-14 2-19z"/></svg>';

// One entry per catalog "demo" value. Keep the `  name: a => ` shape: check.mjs looks for it.
const DEMOS = {
  mam: a => `<div class="d-mam" data-mood="${a.mood ?? 'neutral'}"><i class="d-shadow"></i>${svgOf(a.stage)}<span class="d-z">z</span></div>`,
  evolve: a => `<div class="d-evolve"><i class="glow"></i><div class="d-mam from" data-mood="happy">${svgOf(a.fromStage)}</div><div class="d-mam to" data-mood="happy">${svgOf(a.stage)}</div></div>`,
  button: a => `<span class="d-btn">Ghi nhận nước</span>`,
  check: a => check,
  switch: a => `<div class="d-col"><div class="d-switch"><i class="thumb"></i></div><p class="d-cap">Đang bật</p></div>`,
  tabs: a => `<nav class="d-tabs"><i class="pill"></i><span>Hôm nay</span><span>Lộ trình</span><span>Tổ đội</span><span>Cá nhân</span></nav>`,
  chips: a => `<div class="d-chips"><span>5 phút</span><span class="on">15 phút</span><span>30 phút</span><span>45 phút</span></div>`,
  rows: a => `<ul class="d-rows"><li>Buổi tập chính</li><li>Bữa ăn theo mục tiêu</li><li>Uống nước</li><li>Đứng dậy một chút</li><li>Nhiệm vụ ẩn</li></ul>`,
  number: a => `<div class="d-col"><b class="d-num">${Number(a.value ?? 0).toLocaleString('vi-VN')}</b><p class="d-cap">${a.label ?? ''}</p></div>`,
  bar: a => `<div class="d-col"><div class="d-bar"><i class="fill" style="transform:scaleX(${a.value ?? 1})"></i></div><p class="d-cap">${a.label ?? ''}</p></div>`,
  skeleton: a => `<div class="d-skel"><i></i><i></i><i></i></div>`,
  snackbar: a => `<div class="d-snack"><span>Đã lưu thêm một phần nước</span><b>Hoàn tác</b><i class="countdown"></i></div>`,
  field: a => `<div class="d-field"><span>Chiều cao · cm</span><div class="input">250</div><p class="msg">Chiều cao cần trong khoảng 120–230 cm.</p></div>`,
  pending: a => `<div class="d-pending"><i class="dot"></i><span>Nước vừa ghi · Đang chờ gửi</span></div>`,
  water: a => `<div class="d-col"><div class="d-water"><i class="on"></i><i class="on"></i><i class="on"></i><i class="new"><b class="level"></b><b class="drop"></b></i><i></i><i></i><i></i><i></i></div><p class="d-cap">4 / 8 phần</p></div>`,
  revert: a => `<div class="d-col"><div class="d-water"><i class="on"></i><i class="on"></i><i class="on"></i><i class="undo"><b class="level"></b></i><i></i><i></i><i></i><i></i></div><p class="d-cap d-err msg">Chưa lưu được · Thử lại</p></div>`,
  quest: a => `<div class="d-quest">${check}<span>Buổi tập chính</span><b class="d-chip">+50 XP</b></div>`,
  reward: a => `<span class="d-chip">${a.label ?? '+10 XP'}</span>`,
  coins: a => `<div class="d-coins"><i class="coin"></i><i class="coin"></i><i class="coin"></i><span class="d-coinchip"><b>${a.value ?? 255}</b> xu</span></div>`,
  hidden: a => `<div class="d-hidden"><div class="front">Nhiệm vụ ẩn · mở vào buổi tối</div><div class="back">Kết thúc ngày trước 23:00 · +30 XP</div></div>`,
  sky: a => `<div class="d-sky"><i class="night"></i><i class="dusk"></i><i class="moon"></i><i class="star"></i><i class="star"></i><i class="star"></i></div>`,
  steps: a => `<div class="d-steps"><div class="bar"><i class="fill"></i></div><div class="content">Nhịp sống của bạn</div></div>`,
  arch: a => `<div class="d-arch"><span>Khỏe hơn mỗi ngày</span><i class="tick"></i></div>`,
  ring: a => `<svg class="d-ring" viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="prog" cx="60" cy="60" r="52" pathLength="1" style="stroke-dashoffset:${1 - (a.value ?? 1)}"/><text x="60" y="68">${a.label ?? ''}</text></svg>`,
  swap: a => `<div class="d-swap"><div class="old">Cơm gà, rau củ · 820 kcal</div><div class="new">Cơm cá và rau luộc · 790 kcal</div></div>`,
  pose: a => `<svg class="d-pose" viewBox="0 0 120 120"><g class="a"><circle cx="60" cy="24" r="10"/><path d="M60 34v36M60 44l-22-10M60 44l22-10M60 70l-14 34M60 70l14 34"/></g><g class="b"><circle cx="60" cy="30" r="10"/><path d="M60 40v30M60 50l-24 6M60 50l24 6M60 70l-22 30M60 70l22 30"/></g></svg>`,
  breathe: a => `<div class="d-breathe"><i class="circle"></i><span class="in">Hít vào</span><span class="out">Thở ra</span></div>`,
  timer: a => `<div class="d-timer"><b>08:42</b><span class="run">Đang tập</span><span class="pause">Tạm dừng</span></div>`,
  level: a => `<div class="d-level"><i class="rays"></i><div class="badge">${a.value ?? 5}</div><b>${a.label ?? ''}</b></div>`,
  flame: a => flame,
  milestone: a => `<div class="d-milestone">${flame}<div class="badge">${a.value ?? 7}</div><span class="ribbon">${a.value ?? 7} ngày giữ nhịp</span></div>`,
  reset: a => `<div class="d-reset"><div class="best">Kỷ lục 12 ngày vẫn ở đây</div><div class="cta">Bắt đầu từ một việc nhỏ</div></div>`,
  path: a => `<div class="d-path"><b class="line"><i class="fill"></i></b><i class="node done"></i><i class="node cur"></i><i class="node"></i><i class="node"></i><i class="node"></i></div>`,
  unlock: a => `<div class="d-unlock"><div class="item"><i class="sheen"></i></div><span class="stamp">Đã sở hữu</span><span class="d-coinchip"><b>170</b> xu</span></div>`,
  theme: a => `<div class="d-theme"><i class="old"></i><i class="new"></i><span>Rừng xanh</span></div>`,
  plane: a => `<div class="d-plane"><span class="d-btn">Gửi cho Minh</span><span class="sent">Đã gửi lời nhắc</span><svg class="plane" viewBox="0 0 24 24"><path d="M2 11l20-9-9 20-2-9z"/></svg></div>`,
  rank: a => `<div class="d-rank"><b class="d-num">2</b><span>Nhịp sống mới · <b class="pct">79</b>%</span></div>`,
  bell: a => `<div class="d-bell"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 3 8 3 8H3s3-2 3-8M10 20a2 2 0 0 0 4 0"/></svg><i class="dot"></i></div>`,
  page: a => `<div class="d-page"><i class="sheet"></i><i class="leaf"></i><span class="saved">Đã lưu</span></div>`,
  quote: a => `<blockquote class="d-quote"><span>“Bước nhỏ</span><span>vẫn là</span><span>bước tiến.”</span></blockquote>`,
  ticket: a => `<div class="d-ticket"><span>Vé giữ nhịp</span><b>+1 vé</b></div>`,
  rig: a => `<div class="d-rig" data-prop="${a.prop ?? 'mat'}">${rig}</div>`,
  week: a => `<div class="d-week"><i class="done"></i><i class="frost"><svg class="ice" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg></i><i class="done"></i><i></i></div>`,
};

function count(stage, el, t, a) {
  const fmt = n => Math.round(n).toLocaleString('vi-VN');
  const probe = document.createElement('i');
  probe.style.cssText = 'position:absolute;left:-9999px;width:1px;height:1px';
  stage.append(probe);
  const anim = probe.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms(t, a), easing: easing(t.easingToken ?? a.easingToken), delay: t.delayMs ?? 0, fill: 'both' });
  const tick = () => {
    if (!probe.isConnected) return;
    el.textContent = fmt(t.from + (t.to - t.from) * parseFloat(getComputedStyle(probe).opacity));
    if (anim.playState !== 'finished') requestAnimationFrame(tick);
  };
  tick();
}

function particles(stage, t, a) {
  const colors = t.colors ?? tokens.particles.colors;
  const n = Math.min(t.count ?? tokens.particles.maxCount, tokens.particles.maxCount);
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.className = 'd-particle';
    p.style.background = colors[i % colors.length];
    stage.append(p);
    const angle = (i / n) * Math.PI * 2;
    const dist = (t.distance ?? 80) * (0.6 + ((i * 37) % 10) / 25);
    p.animate([
      { opacity: 1, transform: 'translate(-50%,-50%) scale(0.4) rotate(0deg)' },
      { opacity: 0, transform: `translate(calc(-50% + ${(Math.cos(angle) * dist).toFixed(1)}px), calc(-50% + ${(Math.sin(angle) * dist).toFixed(1)}px)) scale(1) rotate(${i % 2 ? 120 : -120}deg)` },
    ], { duration: ms(t, a), easing: easing(t.easingToken ?? 'exit'), delay: t.delayMs ?? 0, fill: 'both' });
  }
}

function play(stage, a) {
  for (const t of a.tracks) {
    if (t.type === 'particles') { particles(stage, t, a); continue; }
    stage.querySelectorAll(t.target).forEach((el, i) => {
      if (t.type === 'count') return count(stage, el, t, a);
      el.animate(t.keyframes, {
        duration: ms(t, a),
        easing: easing(t.easingToken ?? a.easingToken),
        delay: (t.delayMs ?? 0) + i * (t.staggerMs ?? 0),
        iterations: t.iterations ?? (a.loop ? Infinity : 1),
        direction: t.direction ?? 'normal',
        fill: 'both',
      });
    });
  }
}

for (const a of catalog) {
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.tier = a.tier;
  card.innerHTML = `<h2>${a.id}</h2>
    <p class="meta">${a.tier === 1 ? 'Cốt lõi' : 'Thêm điểm nhấn'} · ${a.kind} · ${a.screens.join(', ')}<br>Kích hoạt: ${a.trigger}</p>
    <div class="stage" aria-hidden="true"></div>
    <p class="rm">Khi giảm chuyển động: ${a.reducedMotion}</p>
    <button class="play" type="button">Phát</button>`;
  const stage = card.querySelector('.stage');
  const button = card.querySelector('.play');
  const reset = () => {
    stage.innerHTML = DEMOS[a.demo](a);
    // Exercises rest on their own start pose, not the rig's neutral stance.
    if (a.kind === 'exercise') for (const t of a.tracks) if (t.keyframes) {
      const { offset, easing, ...first } = t.keyframes[0];
      stage.querySelectorAll(t.target).forEach(el => Object.assign(el.style, first));
    }
    button.textContent = 'Phát';
    delete card.dataset.playing;
  };
  card.reset = reset;
  button.addEventListener('click', () => {
    if (card.dataset.playing) return reset();
    reset();
    if (rmToggle.checked) return;
    play(stage, a);
    if (a.loop) { card.dataset.playing = '1'; button.textContent = 'Dừng'; }
  });
  reset();
  grid.append(card);
}
document.getElementById('tier').addEventListener('change', e => {
  for (const card of grid.querySelectorAll(':scope > .card')) card.hidden = e.target.value !== '' && card.dataset.tier !== e.target.value;
});
</script>
</html>
