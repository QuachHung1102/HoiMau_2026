        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: '`NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`ONBOARDING_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /freeze-tickets:
    get:
      operationId: getTickets
      tags: [tickets]
      summary: Tickets and eligible dates
      description: 'Tickets held, the cap, and the dates a ticket can be applied to with a preview of the streak (S34, S78).'
      x-auth: user
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/Tickets' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`ONBOARDING_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /freeze-tickets/use:
    post:
      operationId: useTicket
      tags: [tickets]
      summary: Apply a ticket to a date
      description: 'Applies one ticket to today, or to yesterday until 15:00 local. One ticket per date. A ticket keeps the streak; it never raises it.'
      x-auth: user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TicketUseRequest' } } }
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/Tickets' } } }
        '400':
          description: '`BAD_JSON`, `IDEMPOTENCY_KEY_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`ONBOARDING_REQUIRED`, `IDEMPOTENCY_KEY_REUSED`, `NO_TICKET`, `TICKET_DATE_NOT_ELIGIBLE`, `TICKET_ALREADY_USED_FOR_DATE`, `TICKET_NOT_NEEDED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token returned by register and login.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per user action.
      schema:
        type: string
        format: uuid
    QuestCode:
      name: questCode
      in: path
      required: true
      description: Stable quest code, for example `WATER_8`.
      schema:
        type: string
    ItemCode:
      name: itemCode
      in: path
      required: true
      description: Stable shop item code.
      schema:
        type: string
  headers:
    RetryAfter:
      description: Seconds to wait before the next request.
      schema:
        type: integer
        minimum: 1
  schemas:
    # ---- common.ts ----
    IsoDateTime:
      type: string
      format: date-time
      description: ISO 8601 instant.
    DateLabel:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: A logical date, `YYYY-MM-DD`.
    Uuid:
      type: string
      format: uuid
    ErrorCode:
      type: string
      enum:
        - BAD_JSON
        - IDEMPOTENCY_KEY_REQUIRED
        - SESSION_INVALID
        - NOT_FOUND
        - ONBOARDING_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - PAYLOAD_TOO_LARGE
        - VALIDATION_FAILED
        - RATE_LIMITED
        - INTERNAL
        - DAY_CLOSED
        - OCCURRED_AT_INVALID
        - REGISTRATION_UNAVAILABLE
        - NAME_NOT_ALLOWED
        - INVALID_CREDENTIALS
        - RESET_CODE_INVALID
        - AGE_NOT_ALLOWED
        - ARCHETYPE_NOT_ALLOWED
        - ARCHETYPE_COOLDOWN
        - QUEST_NOT_FOUND
        - QUEST_NOT_TICKABLE
        - QUEST_ALREADY_COMPLETE
        - TICK_NOT_FOUND
        - UNDO_NOT_LATEST
        - UNDO_WINDOW_EXPIRED
        - UNDO_COINS_SPENT
        - BEDTIME_TOO_EARLY
        - SWAP_LIMIT_REACHED
        - SWAP_CANDIDATE_INVALID
        - MEAL_ALREADY_LOGGED
        - PLAN_NOT_FOUND
        - PERK_POINTS_INSUFFICIENT
        - PERK_ALREADY_UNLOCKED
        - ITEM_NOT_FOUND
        - ALREADY_OWNED
        - ITEM_LOCKED_LEVEL
        - ITEM_NOT_PURCHASABLE
        - INSUFFICIENT_COINS
        - ITEM_NOT_OWNED
        - ALREADY_IN_GUILD
        - GUILD_NAME_TAKEN
        - INVITE_CODE_INVALID
        - GUILD_FULL
        - NOT_IN_GUILD
        - LEADER_MUST_TRANSFER
        - NOT_LEADER
        - TRANSFER_TARGET_INVALID
        - NUDGE_NOT_SAME_GUILD
        - NUDGE_OUTSIDE_WINDOW
        - NUDGE_RECEIVER_LIMIT
        - NUDGE_SENDER_LIMIT
        - NUDGE_RECEIVER_MUTED
        - NUDGE_NOT_NEEDED
        - NUDGE_TEMPLATE_UNKNOWN
        - NO_TICKET
        - TICKET_DATE_NOT_ELIGIBLE
        - TICKET_ALREADY_USED_FOR_DATE
        - TICKET_NOT_NEEDED
    ErrorResponse:
      type: object
      description: The one error body (`ApiErrorBody` in `domain/contract/common.ts`).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 'English diagnostic; never shown to the user.' }
            details:
              description: |
                Present for some codes: `VALIDATION_FAILED` has the members of `ValidationDetails`;
                `ARCHETYPE_COOLDOWN` has `availableAt` (instant); `ARCHETYPE_NOT_ALLOWED` has `allowed`
                (archetypes); `ITEM_LOCKED_LEVEL` on a purchase has `minLevel`; `INSUFFICIENT_COINS` has
                `price` and `coin`.
              anyOf:
                - $ref: '#/components/schemas/ValidationDetails'
                - type: object
                  additionalProperties: true
    ValidationDetails:
      type: object
      description: The `error.details` of `VALIDATION_FAILED`.
      required: [fields]
      properties:
        fields:
          type: array
          items:
            type: object
            required: [field, rule]
            properties:
              field: { type: string, description: 'The body property that failed; for a query or path parameter its name (for example `from`); for the idempotency header the literal `Idempotency-Key`.' }
              rule: { type: string, enum: [required, min, max, format, enum] }
    TitleKey:
      type: string
      enum: [TAN_BINH, NGUOI_KIEN_TRI, CHIEN_BINH_KY_LUAT, KIEN_TUONG, HUYEN_THOAI_THE_HINH]
      description: Title of a level range; the app maps it to its Vietnamese text.
    GameEvent:
      description: |
        Something this request caused. `LEVEL_UP` and `PET_STAGE_UP` fire only when the XP high-water
        mark crosses a threshold, so they are never repeated after an undo.
      oneOf:
        - type: object
          required: [type, questCode]
          properties:
            type: { const: QUEST_COMPLETED }
            questCode: { type: string }
        - type: object
          required: [type, level, titleKey, perkPointsGained]
          properties:
            type: { const: LEVEL_UP }
            level: { type: integer, minimum: 2 }
            titleKey: { $ref: '#/components/schemas/TitleKey' }
            perkPointsGained: { type: integer, minimum: 1 }
        - type: object
          required: [type, stage]
          properties:
            type: { const: PET_STAGE_UP }
            stage: { $ref: '#/components/schemas/PetStage' }
        - type: object
          required: [type]
          properties:
            type: { const: STORY_ALL_DONE }
    Delta:
      type: object
      description: Signed changes caused by this request.
      required: [xp, coin, events]
      properties:
        xp: { type: integer }
        coin: { type: integer }
        events:
          type: array
          items: { $ref: '#/components/schemas/GameEvent' }
    ActionResult:
      type: object
      required: [actionId, day, delta]
      properties:
        actionId: { $ref: '#/components/schemas/Uuid', description: 'Always the `Idempotency-Key` of this request. For a tick and a nutrition log it is also the id of the row created. An undo and a bedtime mark (first or repeated) create no row under it; the undone tick is the `tickId` of the request.' }
        day: { $ref: '#/components/schemas/DayState' }
        delta: { $ref: '#/components/schemas/Delta' }

    # ---- domain/types.ts ----
    Archetype:
      type: string
      enum: [TANKER, ASSASSIN, SUPPORTER]
    Sex:
      type: string
      enum: [MALE, FEMALE]
    ActivityLevel:
      type: string
      enum: [SEDENTARY, LIGHT, MODERATE, ACTIVE, VERY_ACTIVE]
    MealSlot:
      type: string
      enum: [BREAKFAST, LUNCH, DINNER, SNACK]
    Modality:
      type: string
      enum: [RESISTANCE, CARDIO, HIIT, MOBILITY, BREATHING]
    SpaceRequirement:
      type: string
      enum: [DESK_SIDE, ROOM, GYM, OUTDOOR]
    QuestCategory:
      type: string
      enum: [STORY, DAILY, HIDDEN]
    PetStage:
      type: string
      enum: [EGG, HATCHLING, JUVENILE, ADULT, MYTHIC]
    PetMood:
      type: string
      enum: [HAPPY, NEUTRAL, TIRED]
    DayOutcome:
      type: string
      enum: [COMPLETED, FROZEN, MISSED]
    IngredientTag:
      type: string
      enum: ['co:thit-do', 'co:gia-cam', 'co:hai-san', 'co:trung', 'co:sua', 'co:dau-phong', 'co:gluten', 'co:dau-nanh']
      description: An ingredient tag a user may exclude from meal suggestions.

    # ---- core.ts: auth ----
    RegisterRequest:
      type: object
      required: [email, password, displayName, acceptedTerms]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 40 }
        acceptedTerms: { const: true, description: 'The user accepted the terms; anything but `true` is rejected.' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    AuthSession:
      type: object
      required: [token, userId, onboarded]
      properties:
        token: { type: string, description: 'Opaque bearer token; send it as `Authorization: Bearer <token>`.' }
        userId: { $ref: '#/components/schemas/Uuid' }
        onboarded: { type: boolean }
    ForgotRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
    ResetRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email: { type: string }
        code: { type: string, description: 'The 8-digit code from the email.' }
        newPassword: { type: string, minLength: 8, maxLength: 128 }

    # ---- core.ts: profile ----
    OnboardingRequest:
      type: object
      required: [timezone, archetype, heightCm, weightKg, birthYear, sex, activityLevel]
      properties:
        timezone: { type: string, description: 'IANA time zone name, one of `GET /meta/timezones`.' }
        archetype: { $ref: '#/components/schemas/Archetype' }
        heightCm: { type: number, minimum: 120, maximum: 230 }
        weightKg: { type: number, minimum: 30, maximum: 250 }
        birthYear: { type: integer, description: 'Age = current year in the time zone minus this; 16 to 90 is accepted.' }
        sex: { $ref: '#/components/schemas/Sex' }
        activityLevel: { $ref: '#/components/schemas/ActivityLevel' }
    BiometricsRequest:
      type: object
      required: [heightCm, weightKg, birthYear, sex, activityLevel]
      properties:
        heightCm: { type: number, minimum: 120, maximum: 230 }
        weightKg: { type: number, minimum: 30, maximum: 250 }
        birthYear: { type: integer }
        sex: { $ref: '#/components/schemas/Sex' }
        activityLevel: { $ref: '#/components/schemas/ActivityLevel' }
        archetype: { $ref: '#/components/schemas/Archetype', description: 'Only when the new numbers no longer allow the current archetype; this change is not subject to the cooldown.' }
    ArchetypeRequest:
      type: object
      required: [archetype]
      properties:
        archetype: { $ref: '#/components/schemas/Archetype' }
    MePatch:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 40 }
        timezone: { type: string, description: 'IANA time zone name. Changing it never recomputes past days.' }
    PrescriptionResponse:
      type: object
      description: The domain `Prescription`, when it was computed, for which archetype, and the latest biometrics of the caller.
      required: [bmr, tdee, calorieTarget, proteinG, carbsG, fatG, waterMl, safetyClamped, macroAdjusted, computedAt, archetype, biometrics]
      properties:
        bmr: { type: number }
        tdee: { type: number }
        calorieTarget: { type: integer }
        proteinG: { type: integer }
        carbsG: { type: integer }
        fatG: { type: integer }
        waterMl: { type: integer, description: 'Rounded to 250 ml.' }
        safetyClamped: { type: boolean, description: 'The calorie target was raised to the safety floor.' }
        macroAdjusted: { type: boolean, description: 'The macro fallback was used.' }
        computedAt: { $ref: '#/components/schemas/IsoDateTime' }
        archetype: { $ref: '#/components/schemas/Archetype' }
        biometrics: { $ref: '#/components/schemas/Biometrics' }
    Biometrics:
      type: object
      description: |
        The latest biometric snapshot of the caller, returned so the edit form can be pre-filled (S37).
        The app never caches this object to disk. It is part of `PrescriptionResponse` only: no other
        response carries these values, and no guild, leaderboard, nudge or other social response ever does.
      required: [heightCm, weightKg, birthYear, sex, activityLevel]
      properties:
        heightCm: { type: number, minimum: 120, maximum: 230 }
        weightKg: { type: number, minimum: 30, maximum: 250 }
        birthYear: { type: integer }
        sex: { $ref: '#/components/schemas/Sex' }
        activityLevel: { $ref: '#/components/schemas/ActivityLevel' }
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }
    Me:
      type: object
      description: '`progression`, `stats`, `pet` and `appearance` are null before onboarding.'
      required: [user, progression, stats, pet, appearance]
      properties:
        user:
          type: object
          required: [id, email, displayName, timezone, archetype, archetypeChangeAvailableAt, onboarded]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            email: { type: string }
            displayName: { type: string }
            timezone: { type: string }
            archetype:
              description: Null before onboarding.
              oneOf:
                - $ref: '#/components/schemas/Archetype'
                - type: 'null'
            archetypeChangeAvailableAt:
              type: [string, 'null']
              format: date-time
              description: When the archetype may be changed again (14 days after the last change); may be in the past. Null before onboarding.
            onboarded: { type: boolean }
        progression:
          oneOf:
            - $ref: '#/components/schemas/Progression'
            - type: 'null'
        stats:
          type: [object, 'null']
          description: Character stats derived from recorded behaviour, integers 0 to 100.
          required: [hp, en, str, spd]
          properties:
            hp: { type: integer, minimum: 0, maximum: 100 }
            en: { type: integer, minimum: 0, maximum: 100 }
            str: { type: integer, minimum: 0, maximum: 100 }
            spd: { type: integer, minimum: 0, maximum: 100 }
        pet:
          oneOf:
            - $ref: '#/components/schemas/Pet'
            - type: 'null'
        appearance:
          type: [object, 'null']
          description: Equipped items, or the defaults.
          required: [themeCode, petSkinCode, badgeCode]
          properties:
            themeCode: { type: string }
            petSkinCode: { type: string }
            badgeCode: { type: [string, 'null'], description: 'Null when no badge is equipped.' }
    Progression:
      type: object
      required: [xp, level, titleKey, xpIntoLevel, xpForNextLevel, coin, streakCurrent, streakBest, perkPointsAvailable, milestones, lastOutcome, breakNotice]
      properties:
        xp: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1 }
        titleKey: { $ref: '#/components/schemas/TitleKey' }
        xpIntoLevel: { type: integer, minimum: 0 }
        xpForNextLevel: { type: integer, minimum: 1, description: 'Size of the current level, so `xpIntoLevel / xpForNextLevel` is the progress to the next one.' }
        coin: { type: integer, minimum: 0 }
        streakCurrent: { type: integer, minimum: 0 }
        streakBest: { type: integer, minimum: 0 }
        perkPointsAvailable: { type: integer, minimum: 0 }
        milestones:
          type: array
          items:
            type: object
            required: [days, achieved]
            properties:
              days: { type: integer, enum: [7, 30, 100] }
              achieved: { type: boolean }
        lastOutcome:
          description: Outcome of the most recently closed day; null before the first close.
          oneOf:
            - $ref: '#/components/schemas/DayOutcome'
            - type: 'null'
        breakNotice:
          type: [object, 'null']
          description: Present while the most recent close broke a streak.
          required: [previous, date]
          properties:
            previous: { type: integer, minimum: 1, description: 'The streak before the break.' }
            date: { $ref: '#/components/schemas/DateLabel' }
    Pet:
      type: object
      required: [stage, stageIndex, growthPercent, mood, skinCode, nextStage]
      properties:
        stage: { $ref: '#/components/schemas/PetStage' }
        stageIndex: { type: integer, minimum: 0, maximum: 4 }
        growthPercent: { type: integer, minimum: 0, maximum: 100 }
        mood: { $ref: '#/components/schemas/PetMood' }
        skinCode: { type: string }
        nextStage:
          description: Null at the last stage.
          oneOf:
            - $ref: '#/components/schemas/PetStage'
            - type: 'null'

    # ---- core.ts: settings ----
    Settings:
      type: object
      required: [nudgesEnabled, reminderEnabled, reminderWindow, hideStreak, soundEnabled, motion, excludedMealTags]
      properties:
        nudgesEnabled: { type: boolean, description: 'False = guild members cannot nudge this user.' }
        reminderEnabled: { type: boolean }
        reminderWindow: { type: string, enum: [MORNING, NOON, EVENING] }
        hideStreak: { type: boolean }
        soundEnabled: { type: boolean, description: 'Read-only; always false in this build.' }
        motion: { type: string, enum: [SYSTEM, REDUCED, FULL] }
        excludedMealTags:
          type: array
          items: { $ref: '#/components/schemas/IngredientTag' }
    SettingsPatch:
      type: object
      description: Any subset of `Settings` except `soundEnabled`.
      properties:
        nudgesEnabled: { type: boolean }
        reminderEnabled: { type: boolean }
        reminderWindow: { type: string, enum: [MORNING, NOON, EVENING] }
        hideStreak: { type: boolean }
        motion: { type: string, enum: [SYSTEM, REDUCED, FULL] }
        excludedMealTags:
          type: array
          items: { $ref: '#/components/schemas/IngredientTag' }

    # ---- core.ts: day ----
    CalorieWindow:
      type: object
      description: The band that completes the nutrition quest, ends included.
      required: [min, max, target]
      properties:
        min: { type: integer }
        max: { type: integer }
        target: { type: integer }
    QuestState:
      type: object
      required: [code, category, titleKey, progress, targetCount, completed, xpReward, coinReward, locked, lastTick]
      properties:
        code: { type: string }
        category: { $ref: '#/components/schemas/QuestCategory' }
        titleKey: { type: string, description: 'Key the app maps to the quest title.' }
        progress: { type: integer, minimum: 0 }
        targetCount: { type: integer, minimum: 1 }
        completed: { type: boolean }
        xpReward: { type: integer }
        coinReward: { type: integer }
        locked: { type: boolean, description: 'True only for the hidden quest before 18:00 local.' }
        lastTick:
          type: [object, 'null']
          description: Latest live tick of a DAILY quest, for undo; null otherwise.
          required: [id, at]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            at: { $ref: '#/components/schemas/IsoDateTime' }
    DayState:
      type: object
      required: [logicalDate, serverTime, closesAt, caloriesIn, waterMl, waterTargetMl, bedtimeMarkedAt, calorieWindow, quests, story, streak, unreadCount, celebrations]
      properties:
        logicalDate: { $ref: '#/components/schemas/DateLabel' }
        serverTime: { $ref: '#/components/schemas/IsoDateTime' }
        closesAt: { $ref: '#/components/schemas/IsoDateTime', description: 'The next 03:00 in the user time zone.' }
        caloriesIn: { type: number, minimum: 0 }
        waterMl: { type: integer, minimum: 0 }
        waterTargetMl: { type: integer }
        bedtimeMarkedAt: { type: [string, 'null'], format: date-time }
        calorieWindow: { $ref: '#/components/schemas/CalorieWindow' }
        quests:
          type: array
          items: { $ref: '#/components/schemas/QuestState' }
        story:
          type: object
          required: [done, total]
          properties:
            done: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        streak:
          type: object
          required: [current, best]
          properties:
            current: { type: integer, minimum: 0 }
            best: { type: integer, minimum: 0 }
        unreadCount: { type: integer, minimum: 0 }
        celebrations:
          type: array
          description: The unread `STREAK_MILESTONE` inbox items.
          items: { $ref: '#/components/schemas/InboxItemStreakMilestone' }
    ProgressRequest:
      type: object
      properties:
        occurredAt: { $ref: '#/components/schemas/IsoDateTime', description: 'When the action happened; only for a late write.' }
    UndoRequest:
      type: object
      required: [tickId]
      properties:
        tickId: { $ref: '#/components/schemas/Uuid' }
    BedtimeRequest:
      type: object
      properties:
        occurredAt: { $ref: '#/components/schemas/IsoDateTime', description: 'When the action happened; only for a late write.' }
    DaySummary:
      type: object
      required: [logicalDate, outcome, storyDone, storyTotal, waterMl, caloriesIn, workoutMinutes]
      properties:
        logicalDate: { $ref: '#/components/schemas/DateLabel' }
        outcome: { type: string, enum: [COMPLETED, FROZEN, MISSED, OPEN, NONE], description: '`OPEN` = not closed yet; `NONE` = before the first day of the user.' }
        storyDone: { type: integer, minimum: 0 }
        storyTotal: { type: integer, minimum: 0 }
        waterMl: { type: integer, minimum: 0 }
        caloriesIn: { type: number, minimum: 0 }
        workoutMinutes: { type: number, minimum: 0 }
    DayHistory:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items: { $ref: '#/components/schemas/DaySummary' }
    DayDetail:
      type: object
      required: [summary, actions]
      properties:
        summary: { $ref: '#/components/schemas/DaySummary' }
        actions:
          type: array
          description: Recorded actions of the day, newest first.
          items:
            type: object
            required: [id, kind, at, mealSlot, label, value, undone]
            properties:
              id: { $ref: '#/components/schemas/Uuid', description: 'The tick, nutrition log or workout session id. For `BEDTIME`, which has no row of its own, the id of the daily log of that day.' }
              kind: { type: string, enum: [TICK, NUTRITION, WORKOUT, BEDTIME] }
              at: { $ref: '#/components/schemas/IsoDateTime' }
              mealSlot:
                description: For a `NUTRITION` log of a planned meal, its slot; null for a manual entry and for every other kind.
                oneOf:
                  - $ref: '#/components/schemas/MealSlot'
                  - type: 'null'
              label: { type: [string, 'null'], description: '`TICK`: the quest code. `NUTRITION`: the meal name, or the label of a manual entry (null without one). `WORKOUT`: the workout name. `BEDTIME`: null.' }
              value: { type: [number, 'null'], description: '`NUTRITION`: kcal. `WORKOUT`: elapsed seconds. `TICK` and `BEDTIME`: null.' }
              undone: { type: boolean, description: 'True only for a tick that was undone.' }

    # ---- core.ts: perks ----
    PerkCode:
      type: string
      enum: [MEAL_SWAP_PLUS, TICKET_CAP_PLUS, THEME_UNLOCK]
    Perks:
      type: object
      required: [pointsAvailable, perks]
      properties:
        pointsAvailable: { type: integer, minimum: 0 }
        perks:
          type: array
          items:
            type: object
            required: [code, cost, unlocked, repeatable]
            properties:
              code: { $ref: '#/components/schemas/PerkCode' }
              cost: { type: integer, minimum: 1 }
              unlocked: { type: boolean, description: 'The user has this perk. For the repeatable `THEME_UNLOCK`: true once at least one theme was unlocked with it; it can still be unlocked again.' }
              repeatable: { type: boolean, description: 'True only for `THEME_UNLOCK` (one theme per unlock).' }
    PerkUnlockRequest:
      type: object
      required: [perkCode]
      properties:
        perkCode: { $ref: '#/components/schemas/PerkCode' }
        itemCode: { type: string, description: 'The theme to unlock; required for `THEME_UNLOCK` only.' }

    # ---- core.ts: inbox ----
    InboxItemNudge:
      type: object
      required: [id, kind, payload, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { const: NUDGE }
        payload:
          type: object
          required: [senderName, templateCode, text]
          properties:
            senderName: { type: string, description: 'Display name of the guild member who sent it.' }
            templateCode: { type: string }
            text: { type: string, description: 'The template text that was sent.' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
        readAt: { type: [string, 'null'], format: date-time }
    InboxItemStreakMilestone:
      type: object
      required: [id, kind, payload, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { const: STREAK_MILESTONE }
        payload:
          type: object
          required: [days, coins, badgeCode]
          properties:
            days: { type: integer, enum: [7, 30, 100] }
            coins: { type: integer, minimum: 0, description: 'Coins granted with the milestone.' }
            badgeCode: { type: string, description: 'Item code of the badge granted.' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
        readAt: { type: [string, 'null'], format: date-time }
    InboxItemPetTired:
      type: object
      required: [id, kind, payload, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { const: PET_TIRED }
        payload: { type: object, maxProperties: 0, description: 'Always an empty object.' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
        readAt: { type: [string, 'null'], format: date-time }
    InboxItemGuildWeeklyResult:
      type: object
      required: [id, kind, payload, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { const: GUILD_WEEKLY_RESULT }
        payload:
          type: object
          required: [rank, coins, weekStart]
          properties:
            rank: { type: integer, minimum: 1 }
            coins: { type: integer, minimum: 0, description: 'Coins granted for the week.' }
            weekStart: { $ref: '#/components/schemas/DateLabel', description: 'Monday of the closed `Asia/Ho_Chi_Minh` week.' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
        readAt: { type: [string, 'null'], format: date-time }
    InboxItemQuestReminder:
      type: object
      required: [id, kind, payload, createdAt, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { const: QUEST_REMINDER }
        payload: { type: object, maxProperties: 0, description: 'Always an empty object.' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
        readAt: { type: [string, 'null'], format: date-time }
    InboxItem:
      description: One notification; `kind` decides the members of `payload`.
      oneOf:
        - $ref: '#/components/schemas/InboxItemNudge'
        - $ref: '#/components/schemas/InboxItemStreakMilestone'
        - $ref: '#/components/schemas/InboxItemPetTired'
        - $ref: '#/components/schemas/InboxItemGuildWeeklyResult'
        - $ref: '#/components/schemas/InboxItemQuestReminder'
      discriminator:
        propertyName: kind
        mapping:
          NUDGE: '#/components/schemas/InboxItemNudge'
          STREAK_MILESTONE: '#/components/schemas/InboxItemStreakMilestone'
          PET_TIRED: '#/components/schemas/InboxItemPetTired'
          GUILD_WEEKLY_RESULT: '#/components/schemas/InboxItemGuildWeeklyResult'
          QUEST_REMINDER: '#/components/schemas/InboxItemQuestReminder'
    Inbox:
      type: object
      required: [items, unreadCount, nextBefore]
      properties:
        items:
          type: array
          description: Newest first.
          items: { $ref: '#/components/schemas/InboxItem' }
        unreadCount: { type: integer, minimum: 0 }
        nextBefore: { type: [string, 'null'], description: 'Pass as `before` to get the next page; null on the last page.' }
    InboxReadRequest:
      type: object
      properties:
        ids:
          type: array
          description: Items to mark read; omit to mark every unread item.
          items: { $ref: '#/components/schemas/Uuid' }
    InboxReadResult:
      type: object
      required: [unreadCount]
      properties:
        unreadCount: { type: integer, minimum: 0 }

    # ---- core.ts: service ----
    Health:
      type: object
      required: [ok, db, jobs]
      properties:
        ok: { type: boolean, description: 'False exactly when `db` is false; the status is `200` either way. A failed job shows only in its own `jobs[].ok`.' }
        db: { type: boolean, description: 'The database is reachable.' }
        jobs:
          type: array
          description: Last run of each scheduled job since the process started.
          items:
            type: object
            required: [job, lastRunAt, ok]
            properties:
              job: { type: string }
              lastRunAt: { $ref: '#/components/schemas/IsoDateTime' }
              ok: { type: boolean }
    TimezoneList:
      type: object
      required: [zones]
      properties:
        zones:
          type: array
          items: { type: string }

    # ---- content.ts: nutrition ----
    MacroTarget:
      type: object
      required: [kcal, proteinG, carbsG, fatG]
      properties:
        kcal: { type: number }
        proteinG: { type: number }
        carbsG: { type: number }
        fatG: { type: number }
    Meal:
      type: object
      required: [id, code, name, mealSlot, kcal, proteinG, carbsG, fatG, tags, portionText, description, imageKey]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        mealSlot: { $ref: '#/components/schemas/MealSlot' }
        kcal: { type: number }
        proteinG: { type: number }
        carbsG: { type: number }
        fatG: { type: number }
        tags:
          type: array
          items: { type: string }
        portionText: { type: string }
        description: { type: string }
        imageKey: { type: [string, 'null'], description: 'Key of a bundled picture; null when the meal has none.' }
    MealPlanState:
      type: object
      required: [logicalDate, target, caloriesIn, calorieWindow, slots]
      properties:
        logicalDate: { $ref: '#/components/schemas/DateLabel' }
        target: { $ref: '#/components/schemas/MacroTarget' }
        caloriesIn: { type: number, minimum: 0 }
        calorieWindow: { $ref: '#/components/schemas/CalorieWindow' }
        slots:
          type: array
          description: Always the four slots.
          items:
            type: object
            required: [mealSlot, meal, logged, swapsUsed, swapsAllowed, macroWarning]
            properties:
              mealSlot: { $ref: '#/components/schemas/MealSlot' }
              meal:
                description: Null when every candidate for the slot was excluded (no meal could be picked); the slot is still listed.
                oneOf:
                  - $ref: '#/components/schemas/Meal'
                  - type: 'null'
              logged: { type: boolean }
              swapsUsed: { type: integer, minimum: 0 }
              swapsAllowed: { type: integer, description: '3, or 5 with the perk `MEAL_SWAP_PLUS`.' }
              macroWarning: { type: boolean, description: 'No meal fitted the slot target inside the widest tolerance.' }
    SwapCandidates:
      type: object
      required: [mealSlot, swapsRemaining, candidates]
      properties:
        mealSlot: { $ref: '#/components/schemas/MealSlot' }
        swapsRemaining: { type: integer, minimum: 0 }
        candidates:
          type: array
          maxItems: 3
          items:
            allOf:
              - $ref: '#/components/schemas/Meal'
              - type: object
                required: [kcalDelta]
                properties:
                  kcalDelta: { type: number, description: 'Candidate kcal minus the kcal of the meal currently planned for the slot.' }
    SwapRequest:
      type: object
      required: [mealSlot, mealId]
      properties:
        mealSlot: { $ref: '#/components/schemas/MealSlot' }
        mealId: { $ref: '#/components/schemas/Uuid', description: 'One of the current candidates of that slot.' }
    NutritionLogRequest:
      description: |
        Either the planned meal of a slot, or a manual amount. A body with both `mealSlot` and `kcal`
        matches both alternatives and is rejected with `VALIDATION_FAILED`.
      oneOf:
        - type: object
          description: Log the planned meal of that slot.
          required: [mealSlot]
          properties:
            mealSlot: { $ref: '#/components/schemas/MealSlot' }
            occurredAt: { $ref: '#/components/schemas/IsoDateTime', description: 'When the action happened; only for a late write.' }
        - type: object
          description: Manual entry.
          required: [kcal]
          properties:
            kcal: { type: number, minimum: 1, maximum: 5000 }
            label: { type: string, maxLength: 60, description: 'Optional name of the entry.' }
            occurredAt: { $ref: '#/components/schemas/IsoDateTime', description: 'When the action happened; only for a late write.' }

    # ---- content.ts: workout ----
    WorkoutSummary:
      type: object
      required: [id, code, name, modality, durationSec, spaceNeeded, equipment, recommended, kcalEstimate]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        modality: { $ref: '#/components/schemas/Modality' }
        durationSec: { type: integer, description: '300, 900, 1800 or 2700.' }
        spaceNeeded: { $ref: '#/components/schemas/SpaceRequirement' }
        equipment:
          type: array
          description: Equipment codes the workout needs; empty = none.
          items: { type: string }
        recommended: { type: boolean, description: 'The workout suits the archetype of the user.' }
        kcalEstimate: { type: number, description: 'Rough estimate for this user, rounded to 10.' }
    WorkoutCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Recommended first, then by name.
          items: { $ref: '#/components/schemas/WorkoutSummary' }
    WorkoutDetail:
      allOf:
        - $ref: '#/components/schemas/WorkoutSummary'
        - type: object
          required: [sets, steps]
          properties:
            sets: { type: integer, minimum: 1, description: 'How many times the MAIN steps repeat.' }
            steps:
              type: array
              description: Ordered by `position`.
              items:
                type: object
                required: [position, phase, seconds, repsText, move]
                properties:
                  position: { type: integer }
                  phase: { type: string, enum: [WARMUP, MAIN, COOLDOWN] }
                  seconds: { type: integer, minimum: 1 }
                  repsText: { type: string }
                  move:
                    type: object
                    required: [code, name, demoCode, steps, caution]
                    properties:
                      code: { type: string }
                      name: { type: string }
                      demoCode: { type: [string, 'null'], description: 'Key of the demo animation; null for a text-only move.' }
                      steps:
                        type: array
                        description: Exactly three instruction lines.
                        minItems: 3
                        maxItems: 3
                        items: { type: string }
                      caution: { type: string }
    WorkoutCompleteRequest:
      type: object
      required: [exerciseItemId, elapsedSec]
      properties:
        exerciseItemId: { $ref: '#/components/schemas/Uuid' }
        elapsedSec: { type: integer, minimum: 1, description: 'Seconds actually spent, at most twice the duration of the workout.' }
        occurredAt: { $ref: '#/components/schemas/IsoDateTime', description: 'When the action happened; only for a late write.' }
    WorkoutResult:
      type: object
      required: [completed, xpAwarded, coinAwarded, elapsedSec, durationSec, day, delta]
      properties:
        completed: { type: boolean, description: 'True when the session reached at least half of the duration.' }
        xpAwarded: { type: integer, minimum: 0 }
        coinAwarded: { type: integer, minimum: 0 }
        elapsedSec: { type: integer }
        durationSec: { type: integer }
        day: { $ref: '#/components/schemas/DayState' }
        delta: { $ref: '#/components/schemas/Delta' }

    # ---- content.ts: shop and inventory ----
    ShopItem:
      type: object
      required: [code, name, kind, priceCoin, minLevel, assetKey, owned, equipped, locked, purchasable, isDefault]
      properties:
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [THEME, PET_SKIN, BADGE] }
        priceCoin: { type: integer, minimum: 0 }
        minLevel: { type: integer, minimum: 1 }
        assetKey: { type: string }
        owned: { type: boolean }
        equipped: { type: boolean }
        locked: { type: boolean, description: 'The level of the user is below `minLevel`.' }
        purchasable: { type: boolean }
        isDefault: { type: boolean, description: 'Owned by everyone without a purchase.' }
    Shop:
      type: object
      required: [coin, level, items]
      properties:
        coin: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1 }
        items:
          type: array
          items: { $ref: '#/components/schemas/ShopItem' }
    PurchaseResult:
      type: object
      required: [coin, item]
      properties:
        coin: { type: integer, minimum: 0, description: 'Balance after the purchase.' }
        item: { $ref: '#/components/schemas/ShopItem' }
    Inventory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Owned items, the default theme and skin, and earned badges.
          items: { $ref: '#/components/schemas/ShopItem' }

    # ---- social.ts: guild ----
    GuildRole:
      type: string
      enum: [LEADER, MEMBER]
    NudgeBlockReason:
      type: string
      enum: [NUDGE_OUTSIDE_WINDOW, NUDGE_RECEIVER_LIMIT, NUDGE_SENDER_LIMIT, NUDGE_RECEIVER_MUTED, NUDGE_NOT_NEEDED]
      description: The refusals of `POST /guilds/nudge` that depend on the receiver, the sender and the clock; a subset of `ErrorCode`.
    GuildMember:
      type: object
      description: What guild members see of each other; never a biometric or calorie value.
      required: [userId, displayName, level, role, isMe, daysCompletedThisWeek, daysCountedThisWeek, storyDoneToday, nudge]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        level: { type: integer, minimum: 1 }
        role: { $ref: '#/components/schemas/GuildRole' }
        isMe: { type: boolean }
        daysCompletedThisWeek: { type: integer, minimum: 0, maximum: 7, description: 'Days with every STORY quest done, in the Monday-based `Asia/Ho_Chi_Minh` week through today there.' }
        daysCountedThisWeek: { type: integer, minimum: 0, maximum: 7, description: 'Days of that same `Asia/Ho_Chi_Minh` week that count for the member: from Monday, or from the join date if later, through today there.' }
        storyDoneToday: { type: boolean, description: 'The member completed every STORY quest of their own current logical day (their time zone, not the guild week).' }
        nudge:
          type: object
          required: [allowed, reason]
          properties:
            allowed: { type: boolean }
            reason:
              description: |
                Why a nudge cannot be sent now. Null when `allowed` is true. `allowed: false` with
                `reason: null` is legal on exactly one row, the row of the caller (nobody nudges
                themselves); every other refused row names its reason.
              oneOf:
                - $ref: '#/components/schemas/NudgeBlockReason'
                - type: 'null'
    GuildState:
      type: object
      required: [guild]
      properties:
        guild:
          type: [object, 'null']
          description: Null when the user is in no guild.
          required: [id, name, motto, inviteCode, myRole, weekCompletion, inactive, inactiveDays, members]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            name: { type: string }
            motto: { type: string, description: 'Empty string when the guild has none.' }
            inviteCode: { type: string, pattern: '^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}$' }
            myRole: { $ref: '#/components/schemas/GuildRole' }
            weekCompletion: { type: number, minimum: 0, maximum: 1, description: 'Guild average for the Monday-based `Asia/Ho_Chi_Minh` week through today there.' }
            inactive: { type: boolean, description: 'No member recorded anything for 14 days.' }
            inactiveDays: { type: integer, minimum: 0 }
            members:
              type: array
              items: { $ref: '#/components/schemas/GuildMember' }
    GuildCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 3, maxLength: 30 }
        motto: { type: string, maxLength: 80 }
    GuildJoinRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode: { type: string }
    TransferRequest:
      type: object
      required: [userId]
      properties:
        userId: { $ref: '#/components/schemas/Uuid', description: 'Another member of the guild.' }
    Leaderboard:
      type: object
      description: Guild names, completion ratios, counts and ranks only.
      required: [weekStart, final, updatedAt, entries, mine]
      properties:
        weekStart: { $ref: '#/components/schemas/DateLabel', description: 'Monday of the week; weeks run Monday to Sunday in `Asia/Ho_Chi_Minh` for every guild, whatever the time zones of its members.' }
        final: { type: boolean, description: 'True for a closed week.' }
        updatedAt: { $ref: '#/components/schemas/IsoDateTime' }
        entries:
          type: array
          description: Top 50 ranked guilds.
          items:
            type: object
            required: [rank, guildName, avgCompletion, activeMembers, isMine]
            properties:
              rank: { type: integer, minimum: 1 }
              guildName: { type: string }
              avgCompletion: { type: number, minimum: 0, maximum: 1 }
              activeMembers: { type: integer, minimum: 0 }
              isMine: { type: boolean }
        mine:
          type: [object, 'null']
          description: The guild of the caller, also when outside the top 50 or unranked; null when the caller has no guild.
          required: [ranked, rank, avgCompletion, activeMembers]
          properties:
            ranked: { type: boolean, description: 'False with fewer than 3 active members.' }
            rank: { type: [integer, 'null'], minimum: 1 }
            avgCompletion: { type: number, minimum: 0, maximum: 1 }
            activeMembers: { type: integer, minimum: 0 }
    NudgeTemplates:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            type: object
            required: [code, text]
            properties:
              code: { type: string }
              text: { type: string }
    NudgeRequest:
      type: object
      required: [receiverId, templateCode]
      properties:
        receiverId: { $ref: '#/components/schemas/Uuid' }
        templateCode: { type: string }
    NudgeResult:
      type: object
      required: [sentAt, senderRemainingToday]
      properties:
        sentAt: { $ref: '#/components/schemas/IsoDateTime' }
        senderRemainingToday: { type: integer, minimum: 0 }

    # ---- social.ts: journal ----
    Quote:
      type: object
      required: [code, text, author]
      properties:
        code: { type: string }
        text: { type: string }
        author: { type: [string, 'null'] }
    JournalCreateRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
    JournalCreateResult:
      type: object
      required: [entry, quote, xpAwarded, ticket, delta]
      properties:
        entry:
          type: object
          required: [id, createdAt]
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            createdAt: { $ref: '#/components/schemas/IsoDateTime' }
        quote: { $ref: '#/components/schemas/Quote' }
        xpAwarded: { type: integer, minimum: 0 }
        ticket:
          type: object
          required: [outcome, available, cap]
          properties:
            outcome: { type: string, enum: [GRANTED, ALREADY_DECIDED, AT_CAP], description: 'What happened to the weekly ticket of this week.' }
            available: { type: integer, minimum: 0 }
            cap: { type: integer }
        delta: { $ref: '#/components/schemas/Delta' }
    JournalList:
      type: object
      required: [entries, nextBefore]
      properties:
        entries:
          type: array
          description: Newest first.
          items:
            type: object
            required: [id, createdAt, preview, quoteCode]
            properties:
              id: { $ref: '#/components/schemas/Uuid' }
              createdAt: { $ref: '#/components/schemas/IsoDateTime' }
              preview: { type: string, description: 'First 80 characters of the entry.' }
              quoteCode: { type: string }
        nextBefore: { type: [string, 'null'], description: 'Pass as `before` to get the next page; null on the last page.' }
    JournalEntry:
      type: object
      required: [id, createdAt, body, quote]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
        body: { type: string }
        quote: { $ref: '#/components/schemas/Quote' }

    # ---- social.ts: freeze tickets ----
    Tickets:
      type: object
      required: [serverTime, available, cap, eligible, progression]
      properties:
        serverTime: { $ref: '#/components/schemas/IsoDateTime' }
        available: { type: integer, minimum: 0 }
        cap: { type: integer }
        eligible:
          type: array
          description: The dates a ticket may be applied to now, each with a preview.
          items:
            type: object
            required: [date, target, deadline, needed, withoutTicket, withTicket, alreadyUsed]
            properties:
              date: { $ref: '#/components/schemas/DateLabel' }
              target: { type: string, enum: [TODAY, YESTERDAY] }
              deadline: { $ref: '#/components/schemas/IsoDateTime', description: 'Last instant a ticket can still be applied to this date: 15:00 local of the day after `date`.' }
              needed: { type: boolean, description: 'A ticket would protect something on this date.' }
              withoutTicket: { type: integer, minimum: 0, description: 'The streak if no ticket is used.' }
              withTicket: { type: integer, minimum: 0, description: 'The streak if a ticket is used.' }
              alreadyUsed: { type: boolean }
        progression: { $ref: '#/components/schemas/Progression' }
    TicketUseRequest:
      type: object
      required: [date]
      properties:
        date: { $ref: '#/components/schemas/DateLabel' }

    # ---- social.ts: export ----
    ExportDocument:
      type: object
      required: [formatVersion, exportedAt, data]
      properties:
        formatVersion: { const: 1 }
        exportedAt: { $ref: '#/components/schemas/IsoDateTime' }
        data:
          type: object
          additionalProperties: true
          description: Everything the user owns, keyed by data set.
