openapi: 3.1.0
info:
  title: Hồi Máu API
  version: 1.0.0
  summary: The one HTTP contract between the Hồi Máu server and the mobile app.
  description: |
    JSON in and out, UTF-8, request body at most 64 KiB. Schema names are the type names of
    `domain/contract/*.ts` and `domain/types.ts` (`ErrorResponse` is `ApiErrorBody` there);
    `domain/contract/operations.ts` lists the same operations in the same order.

    **Auth** (`x-auth` on every operation): `anon` = no session; `session` = a valid bearer token,
    onboarding not required; `user` = a session and completed onboarding, otherwise
    `409 ONBOARDING_REQUIRED`.

    **Idempotency.** Operations that take the `Idempotency-Key` header require it
    (`400 IDEMPOTENCY_KEY_REQUIRED` when missing). Only 2xx responses are stored; the stored response is
    replayed for the same key and the same request, the same key with a different request gets
    `409 IDEMPOTENCY_KEY_REUSED`, and keys are kept for 7 days. For a quest tick, a nutrition log, a
    workout session and a journal entry the key is also the id of the row it creates. Anonymous
    operations and `POST /auth/logout` take no key.

    **Late writes.** A write may carry `occurredAt`; the client sends it only when the request leaves
    the device more than 60 s after the action. The server maps it to a logical day (03:00 to 02:59 in
    the user's time zone) and answers `409 DAY_CLOSED` when that day is closed or more than 48 h old,
    `422 OCCURRED_AT_INVALID` when the instant is more than 120 s in the future.

    **Unknown properties.** The server ignores request body properties it does not know, so older and
    newer app builds keep working; it never rejects a body for carrying one.

    **Errors.** Every error has the `ErrorResponse` body. `error.code` is the contract; `error.message`
    is an English diagnostic and is never shown to the user. Each operation lists, per status, exactly
    the codes it can return. The general ones are attached by rule: `BAD_JSON` and `PAYLOAD_TOO_LARGE`
    where there is a request body; `IDEMPOTENCY_KEY_REQUIRED` and `IDEMPOTENCY_KEY_REUSED` where the
    key is required; `SESSION_INVALID` unless `anon`; `ONBOARDING_REQUIRED` for `user`;
    `VALIDATION_FAILED` where there is a body, a parameter or a key; `RATE_LIMITED` on every write and
    on `GET /me/export`; `NOT_FOUND` where a resource is looked up by id (and for any unknown route);
    `INTERNAL` everywhere.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: service
    description: Liveness and reference data.
  - name: auth
    description: Accounts, sessions and password reset.
  - name: profile
    description: The user, biometrics, the prescription, data export and account deletion.
  - name: settings
    description: Per-user preferences.
  - name: day
    description: The current logical day, its quests and the day history.
  - name: nutrition
    description: The daily meal plan, swaps and calorie logging.
  - name: workout
    description: The workout catalog and recorded sessions.
  - name: progression
    description: XP, level, streak, pet and perks.
  - name: shop
    description: Cosmetic items bought with coins, and the inventory.
  - name: guild
    description: Guilds, the weekly leaderboard and nudges. Never carries biometric or calorie data.
  - name: inbox
    description: In-app notifications.
  - name: journal
    description: The private journal.
  - name: tickets
    description: Freeze tickets.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [service]
      summary: Liveness and job status
      description: 'Liveness, database reachability and the last run of each scheduled job.'
      x-auth: anon
      security: []
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /meta/timezones:
    get:
      operationId: listTimezones
      tags: [service]
      summary: IANA time zones
      description: 'The time zone names offered by the pickers (S05, S37).'
      x-auth: anon
      security: []
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/TimezoneList' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: 'Creates the account and its first session (S03). `REGISTRATION_UNAVAILABLE` is the single generic refusal; an email already in use gets it too.'
      x-auth: anon
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses:
        '201':
          description: Created.
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } }
        '400':
          description: '`BAD_JSON`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`REGISTRATION_UNAVAILABLE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`, `NAME_NOT_ALLOWED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      description: 'Returns a new session (S02). `INVALID_CREDENTIALS` is uniform: unknown email, wrong password, locked and deleted accounts all get it.'
      x-auth: anon
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } }
        '400':
          description: '`BAD_JSON`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: '`INVALID_CREDENTIALS`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      description: 'Revokes the current session.'
      x-auth: session
      responses:
        '204':
          description: Done; no content.
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a reset code
      description: 'Emails an 8-digit code when the email belongs to an account (S04). The answer is always `202` with an empty object, so it never reveals whether the account exists.'
      x-auth: anon
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ForgotRequest' } } }
      responses:
        '202':
          description: Accepted; an empty object.
          content: { application/json: { schema: { type: object } } }
        '400':
          description: '`BAD_JSON`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with the code
      description: 'Replaces the password and revokes every session (S55). `RESET_CODE_INVALID` is uniform: wrong, expired and used codes and unknown emails all get it.'
      x-auth: anon
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResetRequest' } } }
      responses:
        '204':
          description: Done; no content.
        '400':
          description: '`BAD_JSON`, `RESET_CODE_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /onboarding:
    post:
      operationId: onboard
      tags: [profile]
      summary: Complete onboarding
      description: 'Stores the profile and the first biometric snapshot, computes the prescription and starts the progression (S05 to S08). A user who is already onboarded gets `200` with the current `Me` and nothing changes.'
      x-auth: session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingRequest' } } }
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '400':
          description: '`BAD_JSON`, `IDEMPOTENCY_KEY_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`IDEMPOTENCY_KEY_REUSED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`, `AGE_NOT_ALLOWED`, `ARCHETYPE_NOT_ALLOWED` (`details.allowed`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /me:
    get:
      operationId: getMe
      tags: [profile]
      summary: The signed-in user
      description: 'Profile, progression, derived stats, pet and appearance. The four nullable parts are null before onboarding.'
      x-auth: session
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    patch:
      operationId: patchMe
      tags: [profile]
      summary: Change display name or time zone
      description: 'Updates the given fields (S37).'
      x-auth: user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MePatch' } } }
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '400':
          description: '`BAD_JSON`, `IDEMPOTENCY_KEY_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`ONBOARDING_REQUIRED`, `IDEMPOTENCY_KEY_REUSED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`, `NAME_NOT_ALLOWED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /me/biometrics:
    post:
      operationId: addBiometrics
      tags: [profile]
      summary: Record new biometrics
      description: 'Appends a snapshot and recomputes the prescription (S37). `ARCHETYPE_NOT_ALLOWED` when the new numbers do not allow the archetype in effect.'
      x-auth: user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BiometricsRequest' } } }
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/PrescriptionResponse' } } }
        '400':
          description: '`BAD_JSON`, `IDEMPOTENCY_KEY_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`ONBOARDING_REQUIRED`, `IDEMPOTENCY_KEY_REUSED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`, `AGE_NOT_ALLOWED`, `ARCHETYPE_NOT_ALLOWED` (`details.allowed`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /me/archetype:
    patch:
      operationId: changeArchetype
      tags: [profile]
      summary: Change archetype
      description: 'Changes the archetype and recomputes the prescription; allowed once every 14 days (S37, S81). XP, level and streak are untouched.'
      x-auth: user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ArchetypeRequest' } } }
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '400':
          description: '`BAD_JSON`, `IDEMPOTENCY_KEY_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`ONBOARDING_REQUIRED`, `IDEMPOTENCY_KEY_REUSED`, `ARCHETYPE_COOLDOWN` (`details.availableAt`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`, `AGE_NOT_ALLOWED`, `ARCHETYPE_NOT_ALLOWED` (`details.allowed`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /me/prescription:
    get:
      operationId: getPrescription
      tags: [profile]
      summary: Current targets
      description: 'The prescription in effect (S08, S12).'
      x-auth: user
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/PrescriptionResponse' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`ONBOARDING_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /me/export:
    get:
      operationId: exportMyData
      tags: [profile]
      summary: Export my data
      description: 'Everything the user owns, journal text included, as one JSON document (S44). Never contains another user or any credential.'
      x-auth: user
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/ExportDocument' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`ONBOARDING_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /me/delete:
    post:
      operationId: deleteAccount
      tags: [profile]
      summary: Delete my account
      description: 'Soft-deletes the account after checking the password, revokes every session and leaves the guild (S52). The data is erased for good 30 days later.'
      x-auth: session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeleteAccountRequest' } } }
      responses:
        '204':
          description: Done; no content.
        '400':
          description: '`BAD_JSON`, `IDEMPOTENCY_KEY_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: '`SESSION_INVALID`, `INVALID_CREDENTIALS`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`IDEMPOTENCY_KEY_REUSED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Read settings
      description: 'The preferences of the user (S35, S36, S79).'
      x-auth: user
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`ONBOARDING_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '500':
          description: '`INTERNAL`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    patch:
      operationId: patchSettings
      tags: [settings]
      summary: Change settings
      description: 'Updates the given fields: nudge mute, reminder, hide streak, motion, excluded meal tags. `soundEnabled` cannot be changed.'
      x-auth: user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettingsPatch' } } }
      responses:
        '200':
          description: OK.
          content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } }
        '400':
          description: '`BAD_JSON`, `IDEMPOTENCY_KEY_REQUIRED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401':
          description: '`SESSION_INVALID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '409':
          description: '`ONBOARDING_REQUIRED`, `IDEMPOTENCY_KEY_REUSED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: '`PAYLOAD_TOO_LARGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: '`VALIDATION_FAILED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '429':
          description: '`RATE_LIMITED`'
          headers:
